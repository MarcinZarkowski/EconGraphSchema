syntax = "proto3";

package econgraph.v1;

option go_package = "github.com/MarcinZarkowski/EconGraphSchema/clients/go/v1;econgraphv1";

message CountryNode {
    string iso = 1;
    string name = 2;
}

message CountryNodesFile {
    string version = 1;
    int64 updated_at = 2;
    repeated CountryNode nodes = 3;
}