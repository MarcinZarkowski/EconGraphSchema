syntax = "proto3";

package econgraph.v1;

option go_package = "github.com/MarcinZarkowski/EconGraphSchema/clients/go/v1;econgraphv1";

enum SupplyKind {
    COMMODITY = 0;
    COMPANY = 1;
    SECTOR = 2;
}

message SupplyChainEdge {
    float supplier_revenue_weight = 1;
    float supplied_dependency_weight = 2;

    uint32 to_company_id = 3;

    string from_country_iso = 4;

    SupplyKind supply_kind = 5;

    string commodity_code = 6;

    uint32 from_company_id = 7;

    string from_sector_code = 8;
}

message SupplyChainEdgesFile {
    string version = 1;
    int64 updated_at = 2;
    repeated SupplyChainEdge edges = 3;
}