syntax = "proto3";

package econgraph.v1;

option go_package = "github.com/MarcinZarkowski/EconGraphSchema/clients/go/v1;econgraphv1";

message CompanyNode {
    uint32 id = 1;
    string cik = 2;
    string ticker = 3;
    string name = 4;
    string country_iso = 5;
}

message CompanyNodesFile {
    string version = 1;
    int64 updated_at = 2;
    repeated CompanyNode nodes = 3;
}